# The tables of this repository, declared as data: the authority on what data/ may hold, checked by
# tad (creation-guidelines/tad-engine) on every change. First generated on 2026-11-11 from the schema it replaced.
[tables.architectures]
key = ["id"]
requires = [["origin_year", "origin_author"]]

[[tables.architectures.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.architectures.fields]]
name = "name"
type = "string"
required = true

[[tables.architectures.fields]]
name = "essence"
type = "string"
required = true

[[tables.architectures.fields]]
name = "best_when"
type = "string"
required = true

[[tables.architectures.fields]]
name = "origin_author"
type = "string"

[[tables.architectures.fields]]
name = "origin_year"
type = "integer"
minimum = 1950.0
maximum = 2100.0

[tables.backlog]
key = ["id"]

[[tables.backlog.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.backlog.fields]]
name = "title"
type = "string"
required = true

[[tables.backlog.fields]]
name = "status"
type = "string"
required = true
enum = ["open", "in-progress", "done"]

[[tables.backlog.fields]]
name = "note"
type = "string"

[[tables.backlog.fields]]
name = "opened"
type = "date"
required = true

[tables.concept_sources]
key = ["concept_id", "source_id"]

[[tables.concept_sources.fields]]
name = "concept_id"
type = "string"
required = true

[[tables.concept_sources.fields]]
name = "source_id"
type = "string"
required = true

[tables.practices]
key = ["id"]

[[tables.practices.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.practices.fields]]
name = "name"
type = "string"
required = true

[[tables.practices.fields]]
name = "description"
type = "string"
required = true

[tables.principles]
key = ["id"]
requires = [["origin_year", "origin_author"]]

[[tables.principles.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.principles.fields]]
name = "name"
type = "string"
required = true

[[tables.principles.fields]]
name = "category"
type = "string"
required = true
enum = ["core", "type-driven"]

[[tables.principles.fields]]
name = "statement"
type = "string"
required = true

[[tables.principles.fields]]
name = "caveat"
type = "string"

[[tables.principles.fields]]
name = "origin_author"
type = "string"

[[tables.principles.fields]]
name = "origin_year"
type = "integer"
minimum = 1950.0
maximum = 2100.0

[[tables.principles.fields]]
name = "aliases"
type = "list"
required = true

[tables.relations]
key = ["from_id", "to_id", "relation"]
distinct = [["from_id", "to_id"]]

[[tables.relations.fields]]
