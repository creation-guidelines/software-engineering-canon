type = "string"
required = true

[[tables.relations.fields]]
name = "to_id"
type = "string"
required = true

[[tables.relations.fields]]
name = "relation"
type = "string"
required = true
enum = ["serves", "pairs-with", "same-family-as", "supplies", "enforces"]

[[tables.relations.fields]]
name = "note"
type = "string"

